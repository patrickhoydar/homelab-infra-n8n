services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports: ["${N8N_PORT:-5678}:5678"]
    environment:
      TZ: ${TZ}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASS}
    volumes:
      - ./data:/home/node/.n8n
    networks: [proxy]
networks:
  proxy:
    external: true
